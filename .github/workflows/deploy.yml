name: Deploy GitHub Pages

on:
  push:
    branches: ["main"] # Altere para "master" se a sua branch principal tiver esse nome

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Caminho exato da sua pasta com aspas para evitar erros com espaços
          path: './2DS/PW2/Trabalho interdisciplinar (Urânio)' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
